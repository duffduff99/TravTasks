{% extends "base.html" %}
{# Used for both the first-run password setup and the normal login. #}
{% block content %}
<div class="login">
  <h1>TravTasks</h1>
  {% if mode == 'setup' %}
  <p class="muted">First run: choose the password for this planner.</p>
  <form class="stack" method="post" action="/setup" hx-boost="false">
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus></label>
    <label>Password again <input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
    <button class="btn primary">Save password</button>
  </form>
  {% else %}
  <form class="stack" method="post" action="/login" hx-boost="false">
    <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn primary">Log in</button>
  </form>
  {% endif %}
</div>
{% endblock %}
