# Deploy from Git (for example as a Dockhand stack). Everything else is
# configured inside the app on the Settings page.
services:
  travtasks:
    build: .
    container_name: travtasks
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8000}                      # port the app listens on
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true = login cookie only over HTTPS
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - travtasks-data:/data                   # holds the SQLite file travtasks.db

volumes:
  travtasks-data:
